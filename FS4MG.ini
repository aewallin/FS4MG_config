[EMC]
VERSION = 1.1
# Name of machine, for use with display, etc.
MACHINE = LinuxCNC-FS4MG-A6
DEBUG=0x000FFFFF

# Sections for display options ------------------------------------------------
[DISPLAY]
# Name of display program, e.g., axis
DISPLAY = axis
# Cycle time, in seconds, that display will sleep between polls
CYCLE_TIME = 0.100
# Path to help file
HELP_FILE = doc/help.txt
# Initial display setting for position, RELATIVE or MACHINE
POSITION_OFFSET = RELATIVE
# Initial display setting for position, COMMANDED or ACTUAL
POSITION_FEEDBACK = ACTUAL
# Highest value that will be allowed for feed override, 1.0 = 100%
MAX_FEED_OVERRIDE = 1.2
MAX_SPINDLE_OVERRIDE = 1.0
## mm/s, 10m/min = 167mm/s
MAX_LINEAR_VELOCITY = 167
## mm/s, 500mm/min = 8 mm/s
DEFAULT_LINEAR_VELOCITY = 8
DEFAULT_SPINDLE_SPEED = 1000
# Prefix to be used
PROGRAM_PREFIX = /home/cnc/linuxcnc/nc_files
# Introductory graphic
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 5
EDITOR = geany
TOOL_EDITOR = tooledit
INCREMENTS =  1mm, .1mm, .01mm, .001mm
PYVCP = pyvcp_panel.xml



[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
# NoneType object has no attribute 'rfind'
PARAMETER_FILE = FS4MGparameters.var

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100

[EMCMOT]
#HOMEMOD = homemod
HOMEMOD = cia402_homecomp
EMCMOT = motmod
COMM_TIMEOUT = 1.0


# ns
SERVO_PERIOD = 1000000

[HAL]

HALFILE = A6-machine.hal
# wired USB-jogwheel
HALFILE = xhc-whb04b-6.hal

HALUI = halui
POSTGUI_HALFILE = postgui_pyvcp.hal


[HALUI]
    MDI_COMMAND=(DEBUG,<1>)
    MDI_COMMAND=G10 L20 P0 X[#<_x>/2.0]
    MDI_COMMAND=G10 L20 P0 Y[#<_y>/2.0]
    MDI_COMMAND=(DEBUG,<4>)   
    MDI_COMMAND=(DEBUG,<5>)   
    MDI_COMMAND=G10 L20 P0 X0
    MDI_COMMAND=G10 L20 P0 Y0
    MDI_COMMAND=G10 L20 P0 Z0
    MDI_COMMAND=(DEBUG,<5>)
    MDI_COMMAND=(DEBUG,<9>)
    MDI_COMMAND=(DEBUG,<10>)
    MDI_COMMAND=(DEBUG,<2>)
    MDI_COMMAND=(DEBUG,<12>)
    MDI_COMMAND=(DEBUG,<13>)
    MDI_COMMAND=(DEBUG,<14>)
    
[TRAJ]

COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 17.0
MAX_LINEAR_VELOCITY = 167.0
DEFAULT_LINEAR_ACCELERATION = 200
MAX_LINEAR_ACCELERATION = 500
POSITION_FILE = position_mm.txt

[KINS]
JOINTS = 3
KINEMATICS = trivkins

# Axes sections ---------------
[AXIS_X]
MAX_VELOCITY = 167
MAX_ACCELERATION = 600.0
MIN_LIMIT = -10.0
MAX_LIMIT = 670.0

[AXIS_Y]
MAX_VELOCITY = 167
MAX_ACCELERATION = 600.0
MIN_LIMIT = -200.0
MAX_LIMIT = 200.0

[AXIS_Z]
MAX_VELOCITY = 167
MAX_ACCELERATION = 600.0
MIN_LIMIT = -200.0
MAX_LIMIT = 200.0

[JOINT_0]
TYPE = LINEAR
MAX_VELOCITY = 167
MAX_ACCELERATION = 600.0
MIN_LIMIT = -10.0
MAX_LIMIT = 645.0
HOME = 0.0
HOME_OFFSET = 0.0
# not used for cia402 homing
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_USE_INDEX = YES
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 0
FERROR = 0.25
MIN_FERROR = 0.1
# cia402_homecomp for homing
CIA402_HOMING_ENABLED = 1  
# method=1 reverse to limit-switch, then forward to index
CIA402_HOMING_METHOD=1 	
CIA402_HOMING_SEARCH_VELOCITY=26214
CIA402_HOMING_LATCH_VELOCITY=26214
CIA402_HOMING_ACCELERATION=13107


[JOINT_1]
TYPE = LINEAR
MAX_VELOCITY = 167
MAX_ACCELERATION = 600.0
